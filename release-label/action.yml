name: release-label
description: >
  Label already-built, attested images with a version tag and cut the GitHub
  release. The org-standard release flow (settled in st0x.liquidity#1289):
  pushing a git tag vX.Y.Z LABELS what master CI already built and attested
  for that commit. It does not build, does not deploy. Two refusals keep the
  label honest end to end: no image for the tagged commit -> fail (tag a
  commit master CI has built); no BinAuthz attestation on it -> fail (a
  version tag must never bless an unattested digest).

  Caller prerequisites, in this order, in the same job:
    - actions/checkout (the action peels annotated tags via git);
    - google-github-actions/auth as the app's *-labeler SA (a dedicated SA
      whose custom role can create/update AR tags and read images but
      structurally cannot push -- the app's deployer SA is branch-bound and
      can never satisfy a refs/tags/* subject anyway);
    - google-github-actions/setup-gcloud with install_components: beta
      (attestation listing lives in the beta component);
    - permissions: contents: write (the GitHub release) + id-token: write
      (WIF), and GH_TOKEN exported for the gh CLI.

inputs:
  ar_repo:
    description: >
      Artifact Registry repo base, e.g.
      europe-west3-docker.pkg.dev/t0-artifacts/t0-oracle
    required: true
  images:
    description: >
      Space-separated image names under ar_repo, e.g. "t0-oracle-server" or
      "t0-liquidity t0-liquidity-dashboard t0-liquidity-datasette". Every
      image must exist for the tagged commit and be attested, or nothing is
      labeled.
    required: true
  attestor:
    description: >
      Binary Authorization attestor that must have signed every digest,
      e.g. projects/t0-artifacts/attestors/oracle-image
    required: true
  github_release:
    description: Cut a GitHub release for the tag (notes list the labeled digests).
    required: false
    default: "true"

runs:
  using: composite
  steps:
    - name: Label the tagged commit's attested images
      shell: bash
      run: |
        set -euo pipefail
        VERSION="${GITHUB_REF_NAME}"
        AR_REPO="${{ inputs.ar_repo }}"
        # Peel to the COMMIT: for annotated tags GITHUB_SHA is the tag
        # object, not the commit (actions/runner#712); ^{commit} handles
        # lightweight and annotated identically.
        COMMIT=$(git rev-parse "HEAD^{commit}")
        echo "tag ${VERSION} -> commit ${COMMIT} (GITHUB_SHA was ${GITHUB_SHA})"

        # Phase 1: resolve and verify EVERY image before tagging ANY — a
        # failure mid-loop must not leave earlier images carrying a version
        # label the set as a whole never earned.
        declare -A digest_for
        for image in ${{ inputs.images }}; do
          digest=$(gcloud artifacts docker images describe \
            "${AR_REPO}/${image}:${COMMIT}" \
            --format='value(image_summary.digest)' 2>/dev/null) || true
          if [ -z "${digest:-}" ]; then
            echo "::error::no ${image} image exists for ${COMMIT} — tag a commit that master CI has built (and wait for its build to finish)."
            exit 1
          fi
          attested=$(gcloud beta container binauthz attestations list \
            --project=t0-artifacts --attestor="${{ inputs.attestor }}" \
            --artifact-url="${AR_REPO}/${image}@${digest}" \
            --format='value(name)' | head -1)
          if [ -z "${attested}" ]; then
            echo "::error::${image}@${digest} carries NO attestation from ${{ inputs.attestor }} — refusing to put a version label on an unattested digest."
            exit 1
          fi
          digest_for[$image]="$digest"
        done

        # Phase 2: all verified — label them all.
        for image in ${{ inputs.images }}; do
          gcloud artifacts docker tags add \
            "${AR_REPO}/${image}@${digest_for[$image]}" \
            "${AR_REPO}/${image}:${VERSION}"
          echo "labeled ${image}@${digest_for[$image]} as ${VERSION}"
        done

        # GitHub release on the same tag, so the releases page and the
        # registry agree. Notes carry the exact digests this version names.
        # Never fails the labeling over the release page: the label is
        # already honest; the release is presentation.
        if [ "${{ inputs.github_release }}" = "true" ]; then
          {
            echo "Attested image digest(s) labeled \`${VERSION}\`:"
            echo
            for image in ${{ inputs.images }}; do
              echo "- \`${AR_REPO}/${image}@${digest_for[$image]}\`"
            done
            echo
            echo "t0.devops release manifests pin the pair (\`version:\` + digest) and CI fails if they disagree; deploys always roll the digest."
          } > "${RUNNER_TEMP}/release-notes.md"
          gh release create "${VERSION}" \
            --target "${COMMIT}" \
            --title "${VERSION}" \
            --notes-file "${RUNNER_TEMP}/release-notes.md" \
            || echo "::warning::gh release create ${VERSION} failed (release may already exist); the registry label is minted."
        fi
